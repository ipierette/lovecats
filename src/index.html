<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoveCats</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/header.css" />
  <link rel="stylesheet" href="./css/hero.css" />
</head>

<body>
  <header>
    <a href="#" class="logo">
      <img src="./images/logo-icone.png" alt="Ícone LoveCats" />
      <img src="./images/texto-logo.png" alt="Texto LoveCats" />
    </a>
    <nav>
      <ul>
        <li><a href="#hero">Home</a></li>
        <li><a href="#adocao">Adote um gatinho</a></li>
        <li><a href="#anuncie-doacao">Anuncie Doação</a></li>
        <li><a href="#sobre">Sobre</a></li>
        <li><a href="#api">API</a></li>
      </ul>
    </nav>
    <button class="theme-toggle" aria-label="Alternar tema">
      <img src="./images//moon.svg" alt="icone-lua" />
    </button>
  </header>
  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>Encontre Seu Novo Melhor Amigo</h1>
        <p>
          LoveCats conecta gatinhos carentes de um lar com pessoas prontas para
          oferecer amor incondicional. Cada adoção é uma história de amor esperando
          para acontecer.
        </p>

        <div class="hero-buttons">
          <a href="#adocao" class="btn btn-primary">
            <img src="" alt="" />
            Adotar um Gatinho
          </a>
          <a href="#anuncie-doacao" class="btn btn-secondary">
            <img src="" alt="" />
            Anunciar Doação
          </a>
        </div>
      </div>
    </section>
  </main>
  <script src="./js/index.js"></script>
</body>

</html>
